schema: spec-driven

context: |
  # Lorebook — D&D 5.5e (2024) 角色卡，web-only

  跑團用的角色卡與世界觀筆記。**同一份 codebase 適配手機與桌機版型**，
  不是行動 App。

  > **實作位於 `next/`。** 已退場的 Flutter/Dart 實作已刪除；行為對照見
  > `golden/` 與 `docs/flutter-parity.md`。提案與設計一律以 Next.js 端為準；
  > 引用舊實作時要明說那是對照而非目標。

  ## 內容範圍政策（content-scope）
  - 一切規則內容以 D&D 2024（5r）為基準
  - 規則內容僅來自 SRD 5.2（CC-BY-4.0）或使用者自訂資料；不收錄非 SRD 官方出版內容
  - 不涵蓋怪物、官方劇本/劇情；Product Identity 名稱一律用 SRD 改名
  - 玩家自產內容（角色卡、個人筆記）不受限——排除的是官方出版內容
  - 新功能若引用內容庫，設計時以 SRD 5.2 覆蓋範圍為準（子職每職業 1、背景 4、專長 17 等）
  - 內容庫匯入管線依上游 `srd52` 標記過濾，重匯不會回灌非 SRD 內容

  ## Tech Stack
  - Next.js 16（App Router、React Server Components、Server Actions）
  - React 19 + TypeScript
  - Tailwind CSS v4（設計 token 定義於 `next/app/globals.css` 的 `@theme`）
  - client 狀態：zustand（`lib/state/character-store.ts`）
  - 驗證：zod v4（領域模型即 zod schema，見 `lib/domain/character.ts`）
  - 後端：Supabase（Auth ＋ PostgreSQL，經 `@supabase/ssr` 走 cookie session）
  - 測試：vitest（`npx vitest run`）
  - 部署：Cloudflare Workers，經 `@opennextjs/cloudflare` ＋ wrangler

  ### 不要引入
  - 新的 npm 相依除非確有必要——既有決策一再選擇手寫小東西而非拉套件
    （見 `open-next.config.ts` 對 R2 增量快取的判斷）
  - CSS-in-JS、UI component library：視覺語言是自有的，見下方
  - 資料抓取函式庫（TanStack Query 等）：角色資料是「本機擁有的狀態」而非
    「伺服器快取」，用快取語意表達所有權語意兩邊都彆扭

  ## 資料夾結構
  ```
  next/
    app/          # 路由（App Router）、globals.css、manifest
    components/   # 以功能分組的 UI；components/ui 為共用基礎元件
    lib/          # 領域模型、規則計算、資料存取、state
  ```

  ## 資料架構

  ### 資料分類
  1. **靜態內容庫**（唯讀，SRD 5.2）
     - 表／view：`v_spells`、`v_items`、`classes`、`subclasses`、`class_features`
     - 以匿名 client 讀取——公開資料，與檢視者身分無關
     - 原始資料合計 < 1 MB
  2. **角色卡資料**（使用者自有）
     - `user_characters`：整份角色以 `data jsonb` 儲存，另提升
       `name` / `class_name` / `level` 供清單查詢
     - 主鍵為複合的 `(user_id, id)`；軟刪除以 `deleted_at` 標記
     - 編輯走 client store ＋ debounce 3 秒推送整份文件
  3. **使用者自創內容**
     - `user_backgrounds`、`user_subclasses`
  4. **分享**
     - `character_shares`：token 對應角色；檢視走 `get_shared_character`
       RPC（SECURITY DEFINER），檢視者不需登入

  > **Campaign（多人共用筆記）尚未實作。** 若提案涉及，需一併定義資料表與 RLS。

  ### Supabase 使用原則
  - 所有表格需設定 Row Level Security；**動使用者資料表一律帶 user_id 條件**
    （`db query --linked` 會繞過 RLS）
  - Server Component / Server Action 用帶 session 的 client
    （`lib/supabase/server.ts`）；公開內容用 `createAnonClient`
  - 同一請求內重複的查詢用 React `cache()` 去重——layout 與 page 常需要同一份資料

  ## 視覺語言（不可漂移）

  深色是這個 App 的識別：暗金色調、Cinzel 標題、區段標題的英中雙標＋延伸線、
  卡片角落括號、盾牌造型的 AC 與屬性。這些不是「差不多就好」的裝飾。

  - 設計 token 一律取自 `globals.css`，不在元件裡寫死色碼
  - 深色與淺色**各有一套前景色**，兩套都需滿足 WCAG AA（內文 4.5:1）
  - 中文走系統襯線堆疊（0 bytes）；拉丁字型自我託管。
    **不要為中文引入 web font**——實測 11 個字就要 1.4 MB
  - 骰子表示法統一小寫 NdX（1d8、3×1d4+1）
  - 金額一律「硬幣圖示＋數字」（`CoinAmount`），不用純文字幣別

  ## 版型級距（對齊 Material 3 window size class）
  依**可用寬度**而非裝置種類切換——同一台裝置縮放視窗就會跨級距。
  - **compact**（< 600px）：單欄 ＋ 底部浮動書籤列
  - **medium**（600–840px）：沿用單欄、內容置中限寬；導覽為側邊 Rail
  - **expanded**（≥ 840px）：可多欄（行動頁三欄、角色頁左總覽右分頁）

  拆分原則：優先同檔內以參數切換排列，資料與狀態保持一份；只有互動流程本身
  不同時才分檔案。

  ## 核心功能域
  - **角色卡**：基本資訊、能力值、戰鬥數值（AC 由裝備狀態推導）、技能、
    武器與攻擊（由已裝備武器推導）、法術位與已備法術、裝備與金幣、特性與專長
  - **行動頁**：跑團當下的即時操作。區段順序為狀態 → 資源 → 移動 → 動作，
    對應「我現在怎麼樣 → 還有什麼 → 能走多遠 → 要做什麼」
  - **旅程筆記**：角色個人日誌
  - **建角與升級**：多步驟流程，選項一律走軌道選單而非自由填空
  - **分享**：唯讀檢視，即時活資料不快取

  ## 開發慣例
  - Server Component 取資料、client store 編輯（跑團中連續操作不能每次往返伺服器）
  - Supabase 操作封裝在 `lib/<domain>/` 下，不在元件內直接呼叫
  - 規則計算集中在 `lib/rules/`，須有測試
  - 註解寫「為什麼」與踩過的坑，不寫「做了什麼」
  - 語言：UI 與註解為繁體中文，程式碼與 identifier 用英文

rules:
  proposal:
    - 明確說明影響的資料層（靜態內容庫 / 角色卡 / 自創內容 / 分享）
    - 若涉及新的資料表或 view，需列出主要欄位、型別，並說明 RLS 規則
    - 明確說明影響 compact / medium / expanded 哪些版型
    - 若功能同時存在於可編輯與唯讀（分享）情境，需說明兩者的差異
    - 避免新增 npm 相依；確有必要時說明為何手寫不可行
  design:
    - 說明是 Server Component 還是 client 元件，以及為何
    - 色彩一律取既有 token；若必須新增，需附深色與淺色兩套值與對比數值
    - 觸控目標最小 44px；視覺尺寸不足時以擴大點擊區達成，不改排版
    - 表單控制項需有可及名稱（label 綁定或 aria-label）
    - 涉及導覽或狀態的功能，說明是否需反映在 URL
  tasks:
    - task 粒度以「一個元件」或「一個 lib 模組」或「一條資料存取路徑」為單位
    - 標示依賴關係與可獨立驗證的階段切分
    - 涉及 D&D 規則計算的 task 需附計算公式或規則來源，並要求測試
    - 涉及 Supabase 的 task 需標示是否需要 migration 或 RLS 異動
    - 最後一節須含驗證：tsc、eslint、vitest、build，以及手動驗證步驟
